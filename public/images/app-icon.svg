<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Memories: Save to Photos app icon">
  <defs>
    <clipPath id="frameInside">
      <rect x="38" y="32" width="44" height="56" rx="6"/>
    </clipPath>
  </defs>

  <!-- App-icon green tile -->
  <rect width="120" height="120" rx="27" fill="#17513f"/>

  <!-- Tilted photo frame -->
  <g transform="rotate(-8 60 60)">
    <rect x="31" y="25" width="58" height="70" rx="11" fill="#ffffff"/>
    <rect x="38" y="32" width="44" height="56" rx="6" fill="#17513f"/>
    <g clip-path="url(#frameInside)">
      <circle cx="49" cy="46" r="6" fill="#ffffff" fill-opacity="0.22"/>
      <path d="M36 90 L52 63 L66 90 Z" fill="#ffffff" fill-opacity="0.16"/>
      <path d="M54 90 L69 69 L86 90 Z" fill="#ffffff" fill-opacity="0.24"/>
    </g>
  </g>

  <!-- Amber "save into" arrow (screen-upright, over the frame) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M95 31 C101 57 90 60 77 69" stroke="#0c3a2d" stroke-width="14"/>
    <path d="M64 66 L86 66 L75 84 Z" fill="#0c3a2d" stroke="#0c3a2d" stroke-width="3"/>
    <path d="M95 31 C101 57 90 60 77 69" stroke="#f6a623" stroke-width="9"/>
    <path d="M67 68 L83 68 L75 81 Z" fill="#f6a623" stroke="#f6a623" stroke-width="2"/>
  </g>
</svg>
